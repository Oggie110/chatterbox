[project]
name = "chatterbox-tts"
version = "0.1.6.post1"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI (lean fork for kazen)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    "numpy>=1.24.0",
    "librosa==0.10.2",
    "numba>=0.59.0,<0.61.0",
    "llvmlite>=0.42.0,<0.44.0",
    "s3tokenizer",
    "torch>=2.2.0,<2.3.0",
    "torchaudio>=2.2.0,<2.3.0",
    "transformers==4.46.3",
    "diffusers==0.29.0",
    "resemble-perth==1.0.1",
    "conformer==0.3.2",
    "safetensors==0.5.3",
    "pyloudnorm",
    "omegaconf"
]

[project.urls]
Homepage = "https://github.com/Oggie110/chatterbox"
Repository = "https://github.com/Oggie110/chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
